<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Runner Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .game-container {
      position: relative;
      width: 800px;
      height: 300px;
      background: linear-gradient(to bottom, #1e293b, #0f172a);
      border: 3px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      color: #f1f5f9;
      pointer-events: none;
    }

    .game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .game-over-screen h2 {
      font-size: 2.5rem;
      color: #f43f5e;
      margin-bottom: 10px;
    }

    .game-over-screen p {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #cbd5e1;
    }

    .btn-restart {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-restart:hover {
      background: #7dd3fc;
      transform: scale(1.05);
    }

    .controls-hint {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    @media (max-width: 850px) {
      .game-container {
        width: 95vw;
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <h1>🏃 CYBER RUNNER</h1>

  <div class="game-container">
    <div class="ui-overlay">
      <div id="scoreDisplay">Score: 0</div>
      <div id="highScoreDisplay">High Score: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="game-over-screen" id="gameOverScreen" style="display: none;">
      <h2>GAME OVER</h2>
      <p id="finalScoreText">Your Score: 0</p>
      <button class="btn-restart" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls-hint">
    Press <b>SPACEBAR</b> or <b>TAP / CLICK</b> on screen to Jump!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');

    // Canvas Sizing
    canvas.width = 800;
    canvas.height = 300;

    // Game Variables
    let gameSpeed = 6;
    let score = 0;
    let highScore = localStorage.getItem('runner_highscore') || 0;
    let isGameOver = false;
    let frameCount = 0;
    let obstacles = [];

    highScoreDisplay.textContent = `High Score: ${highScore}`;

    // Player Object
    const player = {
      x: 80,
      y: 200,
      width: 40,
      height: 50,
      color: '#38bdf8',
      velocityY: 0,
      gravity: 0.8,
      jumpPower: -14,
      isGrounded: false,
      
      draw() {
        // Character Body
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0; // Reset glow

        // Eye (Goggles effect)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(this.x + 22, this.y + 10, 14, 8);
      },

      jump() {
        if (this.isGrounded) {
          this.velocityY = this.jumpPower;
          this.isGrounded = false;
        }
      },

      update() {
        this.velocityY += this.gravity;
        this.y += this.velocityY;

        // Ground Collision
        const groundY = canvas.height - 40 - this.height;
        if (this.y >= groundY) {
          this.y = groundY;
          this.velocityY = 0;
          this.isGrounded = true;
        }
      }
    };

    // Obstacle Class
    class Obstacle {
      constructor() {
        this.width = 25 + Math.random() * 20;
        this.height = 30 + Math.random() * 35;
        this.x = canvas.width;
        this.y = canvas.height - 40 - this.height;
        this.color = '#f43f5e';
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0;
      }

      update() {
        this.x -= gameSpeed;
      }
    }

    // Draw Ground
    function drawGround() {
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

      // Neon Top Border for Ground
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();
    }

    // Spawn Obstacles
    function handleObstacles() {
      frameCount++;
      // Spawn obstacle periodically (random gap)
      if (frameCount % Math.floor(1000 / (gameSpeed * 10)) === 0) {
        obstacles.push(new Obstacle());
      }

      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].update();
        obstacles[i].draw();

        // Collision Detection
        if (
          player.x < obstacles[i].x + obstacles[i].width &&
          player.x + player.width > obstacles[i].x &&
          player.y < obstacles[i].y + obstacles[i].height &&
          player.y + player.height > obstacles[i].y
        ) {
          triggerGameOver();
        }
      }

      // Remove offscreen obstacles
      obstacles = obstacles.filter(obs => obs.x + obs.width > 0);
    }

    // Game Loop
    function animate() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGround();

      player.update();
      player.draw();

      handleObstacles();

      // Update Score & Speed
      score++;
      if (score % 500 === 0) gameSpeed += 0.5; // Slowly increase speed

      scoreDisplay.textContent = `Score: ${Math.floor(score / 5)}`;

      requestAnimationFrame(animate);
    }

    // Game Over Logic
    function triggerGameOver() {
      isGameOver = true;
      const finalScore = Math.floor(score / 5);
      finalScoreText.textContent = `Your Score: ${finalScore}`;

      if (finalScore > highScore) {
        highScore = finalScore;
        localStorage.setItem('runner_highscore', highScore);
        highScoreDisplay.textContent = `High Score: ${highScore}`;
      }

      gameOverScreen.style.display = 'flex';
    }

    // Reset Game
    function resetGame() {
      gameSpeed = 6;
      score = 0;
      frameCount = 0;
      obstacles = [];
      isGameOver = false;
      player.y = canvas.height - 40 - player.height;
      player.velocityY = 0;
      gameOverScreen.style.display = 'none';
      animate();
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        player.jump();
      }
    });

    window.addEventListener('touchstart', (e) => {
      if (!isGameOver) {
        player.jump();
      }
    });

    canvas.addEventListener('click', () => {
      if (!isGameOver) {
        player.jump();
      }
    });

    restartBtn.addEventListener('click', resetGame);

    // Start Game Loop
    animate();
  </script>
</body>
</html>
